kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: ros-kube
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "deployments", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: ros-kube
subjects:
  - kind: ServiceAccount
    name: default
    namespace: lge-ebme
roleRef:
  kind: ClusterRole
  name: ros-kube
  apiGroup: rbac.authorization.k8s.io
