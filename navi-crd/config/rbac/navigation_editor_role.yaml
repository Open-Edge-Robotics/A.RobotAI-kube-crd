# permissions for end users to edit navigations.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: navigation-editor-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: navi-crd
    app.kubernetes.io/part-of: navi-crd
    app.kubernetes.io/managed-by: kustomize
  name: navigation-editor-role
rules:
- apiGroups:
  - ebme.lge.com
  resources:
  - navigations
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ebme.lge.com
  resources:
  - navigations/status
  verbs:
  - get
